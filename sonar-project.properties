sonar.projectKey=rmontanana_mdlp
sonar.organization=rmontanana

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=mdlp
sonar.projectVersion=3.0.0

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=src,sample,bench,scripts
sonar.tests=tests,test_package/src

# Build trees, generated coverage HTML (see `make viewcoverage`) and vendored
# third-party code carry no signal: they produced ~83% of the reported issues.
sonar.exclusions=build_*/**,docs/coverage/**,**/CMakeFiles/**

# Benchmarks and samples are not part of the shipped library, so their
# uncovered lines must not drag the project coverage down.
sonar.coverage.exclusions=bench/**,sample/**,scripts/**

# The compilation database records -std=gnu++17, but state it explicitly so the
# reporting standard stays correct even if the scanner falls back to Automatic
# Analysis, which otherwise assumes the newest standard and raises C++20/23
# modernization rules this project cannot apply.
sonar.cfamily.reportingCppStandardOverride=c++17
